# L-ai-SERctrl (Rust, based on LaserGRBL) -- CI for GitLab CE + a self-hosted docker-executor runner.
#
# .yml, not .yaml: only the .yml spelling is auto-detected.
#
#   lint:clippy           clippy, warnings are errors              | lint
#   lint:headers          SPDX header check (tools/check_headers.py) | lint
#   test:cargo            whole workspace incl. golden tests       | test
#   build:linux-appimage  portable AppImage (glibc 2.28 baseline)  | build -> artifact
#   build:windows         x86_64 .exe + resources, zip             | build -> artifact
#   build:macos           universal2 (arm64 + x86_64) + resources  | build -> artifact
#   build:source          git archive of the tree (GPLv3 s.6)      | build -> artifact
#
# Every build is a cross build on the Linux runner with cargo-zigbuild. The
# three builds are independent and `allow_failure: true`: one broken platform
# never blocks the other artifacts (pipeline then shows "passed with warnings").
#
# Runner: docker executor, internet access, non-privileged. The AppImage needs
# no FUSE (appimagetool runs with APPIMAGE_EXTRACT_AND_RUN=1). macOS uses the
# cargo-zigbuild image: it ships the macOS 11.3 SDK (SDKROOT) that linking the
# Apple frameworks needs. Its Rust is older than ours, the job installs ours.
#
# Legal files: Windows zip and macOS tarball hold LICENSE.md, NOTICE.md, CHANGELOG.md and a freshly generated
# THIRD_PARTY_LICENSES.txt (python3 + tools/gen_third_party.py) at the top of the L-ai-SERctrl folder. The
# AppImage holds the same under usr/share/doc/laiserctrl. build:source adds the source tarball so the
# Corresponding Source is offered next to the binaries (GPLv3 section 6).
#
# Windows/macOS artifacts are unsigned. Windows: unzip, run laiserctrl.exe
# (SmartScreen warns). macOS: untar, `xattr -dr com.apple.quarantine L-ai-SERctrl`,
# run L-ai-SERctrl/laiserctrl. The resources folder must stay next to the binary.
#
# No rustfmt gate: the code base is not rustfmt-formatted (long lines kept on
# purpose), a `cargo fmt --check` job would always fail.
#
# Caches: only cargo's download cache (registry + git) keyed by Cargo.lock, and
# the pinned AppImage tools. `target/` is not cached (tens of GB).
#
# Scheduling: every job has an explicit `needs:`; stages are only a fallback
# order. Every build needs both checks, so a red tree never yields artifacts.
#
# Runner-side, not expressible here: Settings > CI/CD > "Auto-cancel redundant
# pipelines" (what makes the `interruptible: true` default do anything).

stages:
  - lint
  - test
  - build

variables:
  # Pinned images/tools: bump deliberately. Rust >= 1.95 (edition 2024).
  RUST_IMAGE: "rust:1.99.0-trixie"
  RUST_TOOLCHAIN: "1.99.0"            # same as RUST_IMAGE; installed in ZIGBUILD_IMAGE
  ZIGBUILD_IMAGE: "ghcr.io/rust-cross/cargo-zigbuild:0.23.4"   # + macOS 11.3 SDK
  CARGO_ZIGBUILD_VERSION: "0.23.4"
  ZIGLANG_VERSION: "0.17.0"           # PyPI `ziglang`: zig as a pip package

  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_INCREMENTAL: "0"              # no use in throw-away build dirs
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  GIT_DEPTH: "1"

default:
  interruptible: true

# One pipeline per change: MR pipeline while an MR is open, branch pipeline
# otherwise, plus tags.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ----------------------------------------------------------- templates ------

# rust toolchain image + cargo download cache.
.rust:
  image: $RUST_IMAGE
  cache:
    - &cargo-cache
      key:
        files:
          - Cargo.lock
      paths:
        - .cargo-home/registry/index/
        - .cargo-home/registry/cache/
        - .cargo-home/git/db/
  before_script:
    - rustc --version && cargo --version

# ---------------------------------------------------------------- lint ------

lint:clippy:
  extends: .rust
  stage: lint
  needs: []
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --locked -- -D warnings

lint:headers:
  image: $RUST_IMAGE
  stage: lint
  needs: []
  script:
    # python3 ships with most images; install only when missing
    - command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null; }
    - python3 -I tools/check_headers.py

# ---------------------------------------------------------------- test ------

test:cargo:
  extends: .rust
  stage: test
  needs: []
  script:
    # golden outputs of the original app live in tests/golden (committed)
    - cargo test --workspace --locked --no-fail-fast

# --------------------------------------------------------------- build ------

# shared by the zigbuild jobs on RUST_IMAGE: pinned zig + cargo-zigbuild in
# the cache dir that packaging/appimage/build-appimage.sh puts on PATH.
.zig-tools:
  extends: .rust
  stage: build
  needs: ["lint:clippy", "lint:headers", "test:cargo"]
  allow_failure: true
  cache:
    - *cargo-cache
    - key: "zig-tools-zigbuild$CARGO_ZIGBUILD_VERSION-zig$ZIGLANG_VERSION"
      paths:
        - .cache/appimage/cargo/
        - .cache/appimage/venv/
        - .cache/appimage/appimagetool-x86_64.AppImage
  before_script:
    - rustc --version && cargo --version
    # python3-venv: zig via pip; binutils: objdump; zip: Windows package
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3 python3-venv binutils file zip >/dev/null
    - |
      T=.cache/appimage
      [ -x "$T/venv/bin/python3" ] || python3 -m venv "$T/venv"
      "$T/venv/bin/python3" -m ziglang version 2>/dev/null | grep -qx "$ZIGLANG_VERSION" \
        || "$T/venv/bin/pip" install --quiet "ziglang==$ZIGLANG_VERSION"
      "$T/cargo/bin/cargo-zigbuild" --version 2>/dev/null | grep -q " $CARGO_ZIGBUILD_VERSION\$" \
        || cargo install --locked --root "$T/cargo" cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
      export PATH="$CI_PROJECT_DIR/$T/cargo/bin:$CI_PROJECT_DIR/$T/venv/bin:$PATH"
    # package version from the workspace manifest
    - VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)"

# Linux first: the primary target.
build:linux-appimage:
  extends: .zig-tools
  script:
    - packaging/appimage/build-appimage.sh 2>&1 | tee build-appimage.log
    # must be the portable zigbuild, never the native fallback
    - |
      if grep -q "WARNING: native build" build-appimage.log; then
        echo "zigbuild not used: AppImage would not be portable" >&2; exit 1
      fi
      MAXG="$(objdump -T target/x86_64-unknown-linux-gnu/release/laiserctrl | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)"
      echo "max GLIBC required: $MAXG"
      [ "$(printf '%s\n2.28\n' "$MAXG" | sort -V | tail -1)" = "2.28" ] || { echo "binary needs glibc > 2.28" >&2; exit 1; }
    # smoke test: the packed AppImage extracts and holds the binary + resources
    - |
      APP="dist/L-ai-SERctrl-$VERSION-x86_64.AppImage"
      chmod +x "$APP"
      (cd "$(mktemp -d)" && "$CI_PROJECT_DIR/$APP" --appimage-extract >/dev/null \
        && test -x squashfs-root/usr/bin/laiserctrl \
        && test -d squashfs-root/usr/share/laiserctrl/resources \
        && test -x squashfs-root/AppRun)
      sha256sum "$APP" | tee "$APP.sha256"
  artifacts:
    name: "L-ai-SERctrl-linux-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 month
    paths:
      - dist/L-ai-SERctrl-*-x86_64.AppImage
      - dist/L-ai-SERctrl-*-x86_64.AppImage.sha256

build:windows:
  extends: .zig-tools
  script:
    - rustup target add x86_64-pc-windows-gnu
    # windows-gnu linked by zig (mingw-w64 libs ship with zig)
    - cargo zigbuild --release --locked -p laiserctrl --target x86_64-pc-windows-gnu
    # GUI subsystem (no console window), 64 bit
    - file target/x86_64-pc-windows-gnu/release/laiserctrl.exe | tee /dev/stderr | grep -qE 'PE32\+ executable.*\(GUI\).*x86-64'
    # zip: L-ai-SERctrl/laiserctrl.exe + L-ai-SERctrl/resources (looked up next to the exe)
    - |
      PKG="L-ai-SERctrl-$VERSION-windows-x86_64"
      STAGE="$(mktemp -d)/L-ai-SERctrl"
      mkdir -p "$STAGE" dist
      cp target/x86_64-pc-windows-gnu/release/laiserctrl.exe "$STAGE/"
      cp -r resources "$STAGE/resources"
      cp LICENSE.md NOTICE.md CHANGELOG.md "$STAGE/"
      python3 -I tools/gen_third_party.py --texts "$STAGE/THIRD_PARTY_LICENSES.txt"
      (cd "$(dirname "$STAGE")" && zip -qr9 "$CI_PROJECT_DIR/dist/$PKG.zip" L-ai-SERctrl)
      sha256sum "dist/$PKG.zip" | tee "dist/$PKG.zip.sha256"
  artifacts:
    name: "L-ai-SERctrl-windows-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 month
    paths:
      - dist/L-ai-SERctrl-*-windows-x86_64.zip
      - dist/L-ai-SERctrl-*-windows-x86_64.zip.sha256

build:macos:
  image: $ZIGBUILD_IMAGE
  stage: build
  needs: ["lint:clippy", "lint:headers", "test:cargo"]
  allow_failure: true
  cache:
    - *cargo-cache
  before_script:
    # image Rust is too old for edition 2024 deps: install ours + both mac targets
    - rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
    - rustup default "$RUST_TOOLCHAIN"
    - rustc --version && cargo --version && cargo zigbuild --version
    - echo "SDKROOT=$SDKROOT" && test -d "$SDKROOT"
    - VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)"
    # python3 runs tools/gen_third_party.py; install only when the image lacks it (needs a Debian/Ubuntu base)
    - command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null; }
  script:
    # universal2 = arm64 + x86_64 in one fat binary
    - cargo zigbuild --release --locked -p laiserctrl --target universal2-apple-darwin
    - BIN=target/universal2-apple-darwin/release/laiserctrl
    # fat Mach-O magic (no `file` needed)
    - test "$(head -c4 "$BIN" | od -An -tx1 | tr -d ' \n')" = "cafebabe"
    # tar.gz keeps the exec bit: L-ai-SERctrl/laiserctrl + L-ai-SERctrl/resources
    - |
      PKG="L-ai-SERctrl-$VERSION-macos-universal"
      STAGE="$(mktemp -d)/L-ai-SERctrl"
      mkdir -p "$STAGE" dist
      install -m755 "$BIN" "$STAGE/laiserctrl"
      cp -r resources "$STAGE/resources"
      cp LICENSE.md NOTICE.md CHANGELOG.md "$STAGE/"
      python3 -I tools/gen_third_party.py --texts "$STAGE/THIRD_PARTY_LICENSES.txt"
      tar -C "$(dirname "$STAGE")" -czf "dist/$PKG.tar.gz" L-ai-SERctrl
      sha256sum "dist/$PKG.tar.gz" | tee "dist/$PKG.tar.gz.sha256"
  artifacts:
    name: "L-ai-SERctrl-macos-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 month
    paths:
      - dist/L-ai-SERctrl-*-macos-universal.tar.gz
      - dist/L-ai-SERctrl-*-macos-universal.tar.gz.sha256

# Corresponding Source (GPLv3 section 6): the committed tree, next to the binaries.
build:source:
  image: $RUST_IMAGE
  stage: build
  needs: []
  before_script:
    # git ships with the rust image; install only when missing
    - command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null; }
    - VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)"
  script:
    - mkdir -p dist
    - git archive --format=tar.gz --prefix="L-ai-SERctrl-$VERSION/" -o "dist/L-ai-SERctrl-$VERSION-source.tar.gz" HEAD
    - sha256sum "dist/L-ai-SERctrl-$VERSION-source.tar.gz" | tee "dist/L-ai-SERctrl-$VERSION-source.tar.gz.sha256"
  artifacts:
    name: "L-ai-SERctrl-source-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 month
    paths:
      - dist/L-ai-SERctrl-*-source.tar.gz
      - dist/L-ai-SERctrl-*-source.tar.gz.sha256
