<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Example for docs/MANUAL.md: layer "Fill" (engraved first), layer "Cut" (cut last). -->
<svg
   width="100mm"
   height="100mm"
   viewBox="0 0 100 100"
   version="1.1"
   id="svg1"
   sodipodi:docname="layers-example.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:document-units="mm"
     inkscape:current-layer="layer2" />
  <defs
     id="defs1" />
  <g
     inkscape:label="Fill"
     inkscape:groupmode="layer"
     id="layer1">
    <rect
       style="fill:#000000;stroke:none"
       id="box"
       width="40"
       height="40"
       x="30"
       y="30" />
  </g>
  <g
     inkscape:label="Cut"
     inkscape:groupmode="layer"
     id="layer2">
    <circle
       style="fill:none;stroke:#ff0000;stroke-width:0.3"
       id="outline"
       cx="50"
       cy="50"
       r="45" />
  </g>
</svg>
