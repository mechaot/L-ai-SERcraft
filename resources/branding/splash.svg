<svg xmlns="http://www.w3.org/2000/svg" width="756" height="333" viewBox="0 0 756 333">
  <!-- © 2026 Andreas Pösch, GPL-3.0-or-later, original artwork. L-ai-SERctrl splash. Original artwork (no LaserGRBL logo material). Render: app/examples/render_artwork.rs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1d2430"/>
    </linearGradient>
    <radialGradient id="hit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#8cc4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="756" height="333" fill="url(#bg)"/>
  <!-- faint raster scan lines -->
