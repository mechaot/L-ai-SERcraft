 x2="756" y2="300"/><line x1="0" y1="306" x2="756" y2="306"/><line x1="0" y1="312" x2="756" y2="312"/><line x1="0" y1="318" x2="756" y2="318"/><line x1="0" y1="324" x2="756" y2="324"/><line x1="0" y1="330" x2="756" y2="330"/>
  </g>
  <!-- workpiece disc, lower half engraved with hatch -->
  <circle cx="618" cy="206" r="80" fill="#161b23" stroke="#3a4352" stroke-width="1.5"/>
  <g stroke="#3d8bff" stroke-width="2" stroke-linecap="round" opacity="0.55"><line x1="538.4" y1="214.0" x2="697.6" y2="214.0"/><line x1="539.6" y1="222.0" x2="696.4" y2="222.0"/><line x1="541.7" y1="230.0" x2="694.3" y2="230.0"/><line x1="544.7" y1="238.0" x2="691.3" y2="238.0"/><line x1="548.7" y1="246.0" x2="687.3" y2="246.0"/><line x1="554.0" y1="254.0" x2="682.0" y2="254.0"/><line x1="560.9" y1="262.0" x2="675.1" y2="262.0"/><line x1="570.0" y1="270.0" x2="666.0" y2="270.0"/><line x1="583.1" y1="278.0" x2="652.9" y2="278.0"/></g>
  <!-- line being burned right now -->
  <line x1="540" y1="206" x2="618" y2="206" stroke="#9fd0ff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- laser head + nozzle -->
  <rect x="588" y="22" width="60" height="40" rx="7" fill="#262d39" stroke="#4b5668" stroke-width="1.5"/>
  <rect x="598" y="32" width="40" height="4" rx="2" fill="#3d8bff" opacity="0.8"/>
  <path d="M604 62 L632 62 L625 76 L611 76 Z" fill="#323b49" stroke="#4b5668" stroke-width="1.5"/>
