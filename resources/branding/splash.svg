  <line x1="618" y1="76" x2="618" y2="206" stroke="#3d8bff" stroke-width="9" opacity="0.45" filter="url(#glow)"/>
  <line x1="618" y1="76" x2="618" y2="206" stroke="#a8d4ff" stroke-width="2"/>
  <circle cx="618" cy="206" r="24" fill="url(#hit)"/>
  <!-- wordmark -->
  <text x="38" y="160" font-family="Noto Sans" font-weight="bold" font-size="58" letter-spacing="-1"><tspan fill="#f2f4f7">L-</tspan><tspan fill="#4d9bff">ai</tspan><tspan fill="#f2f4f7">-SER</tspan><tspan fill="#8e98a8" font-weight="normal">ctrl</tspan></text>
  <rect x="41" y="178" width="70" height="3.5" rx="1.75" fill="#4d9bff"/>
  <text x="41" y="210" font-family="Noto Sans" font-size="17" fill="#9aa3b2">laser engraving &amp; cutting control</text>
  <!-- credit to the original project -->
  <text x="41" y="306" font-family="Noto Sans" font-size="13" fill="#9aa3b2">based on <tspan fill="#d5dae2" font-weight="bold">LaserGRBL</tspan> by <tspan fill="#d5dae2" font-weight="bold">Diego Settimi</tspan></text>
